name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    services:
      # PostgreSQL for tests/pg and tests/server/pg.pn (service containers run on Linux runners only; macOS
      # gets it from Homebrew below). An empty image on macOS skips the container.
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: pin
          POSTGRES_PASSWORD: pin-test-only
          POSTGRES_DB: pin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pin" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PIN_TEST_POSTGRES: postgres://pin:pin-test-only@127.0.0.1:5432/pin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev libpq5
      - name: PostgreSQL (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          for i in $(seq 1 30); do /opt/homebrew/opt/postgresql@16/bin/pg_isready -h 127.0.0.1 && break; sleep 1; done
          /opt/homebrew/opt/postgresql@16/bin/psql -h 127.0.0.1 -d postgres -c "CREATE ROLE pin LOGIN PASSWORD 'pin-test-only'"
          /opt/homebrew/opt/postgresql@16/bin/createdb -h 127.0.0.1 -O pin pin_test
      - name: clang version
        run: clang --version
      - name: Test suite
        run: python3 tests/run_tests.py
      - name: Sanitizers (ASAN + UBSAN; leaks too on Linux)
        run: >
          tools/sanitize.sh tests/hello.pn tests/strmap.pn tests/arith.pn tests/flow.pn tests/json_float.pn tests/strings_list.pn tests/json_hostile.pn tests/db_basics.pn tests/db_lifetimes.pn tests/db_pool.pn tests/crypto.pn tests/json_decode.pn tests/bytes.pn tests/classes.pn tests/nested.pn tests/errors_ok.pn tests/tasks.pn tests/hub.pn tests/json_nested.pn tests/run_client_errors.pn tests/null_basics.pn tests/null_more.pn tests/null_linked.pn tests/null_json.pn tests/null_narrow.pn tests/null_ownership.pn tests/null_scalars.pn tests/null_scalar_class.pn tests/null_scalar_flow.pn tests/null_items.pn tests/null_items_class.pn tests/null_items_more.pn
          examples/wordcount.pn examples/ownership.pn tests/bench/listsum.pn
      - name: HTTP servers under ASAN + UBSAN (sanitize.sh cannot run programs that never exit)
        run: python3 tests/run_tests.py --sanitize
      - name: Installer (install.sh from this checkout into a temp folder)
        run: |
          git config --global --add safe.directory "$PWD"
          PIN_REPO="file://$PWD" PIN_HOME="$RUNNER_TEMP/pin-home" PIN_BIN="$RUNNER_TEMP/pin-bin" sh install.sh
          "$RUNNER_TEMP/pin-bin/pin" examples/fizzbuzz.pn | tail -1
